# Add inside the site's server block, above `location / {`.
#
# Umami lives at /stats on the same origin, so the tracking script is a
# first-party request and the site needs no consent banner.

location /stats/ {
    proxy_pass http://127.0.0.1:3001/stats/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Umami derives visitor counts from the client IP; without these every
    # visitor looks like nginx and the numbers are meaningless.
    proxy_set_header X-Forwarded-Host $host;
}
